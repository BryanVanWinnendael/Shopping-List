name: Deploy App Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 2.5.0)"
        required: false
        type: string

      buildNumber:
        description: "App build number (optional)"
        required: false
        type: string

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.version }}" ] && [ -z "${{ inputs.buildNumber }}" ]; then
            echo "❌ Version or buildNumber required"
            exit 1
          fi
          
          if [ -n "${{ inputs.version }}" ]; then
            if ! echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "❌ Invalid version format. Expected x.y.z"
              exit 1
            fi
          fi
          
          if [ -n "${{ inputs.buildNumber }}" ]; then
            if ! echo "${{ inputs.buildNumber }}" | grep -Eq '^[0-9]+$'; then
              echo "❌ Invalid build number. Expected integer"
              exit 1
            fi
          fi
          
          echo "✅ Inputs valid"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Install dependencies
        working-directory: app
        run: yarn install --frozen-lockfile

      - name: Create App Store Connect API key
        working-directory: app
        run: |
          cat > auth.p8 << 'EOF'
          ${{ secrets.EXPO_ASC_API_KEY }}
          EOF

      - name: Build & Submit
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ secrets.EXPO_APPLE_TEAM_TYPE }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
        run: |
          npx eas --version
          
          if [ -n "${{ inputs.version }}" ] && [ -n "${{ inputs.buildNumber }}" ]; then
            yarn build --v=${{ inputs.version }} --build=${{ inputs.buildNumber }}
          
          elif [ -n "${{ inputs.version }}" ]; then
            yarn build --v=${{ inputs.version }}
          
          else
            yarn build --build=${{ inputs.buildNumber }}
          fi

      - name: Commit version/build bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add app/app.config.js

          if [ -n "${{ inputs.version }}" ] && [ -n "${{ inputs.buildNumber }}" ]; then
            COMMIT_MSG="[App Build] bump version to ${{ inputs.version }} and build number to ${{ inputs.buildNumber }}"

          elif [ -n "${{ inputs.version }}" ]; then
            COMMIT_MSG="[App Build] bump version to ${{ inputs.version }}"

          elif [ -n "${{ inputs.buildNumber }}" ]; then
            COMMIT_MSG="[App Build] bump build number to ${{ inputs.buildNumber }}"

          else
            COMMIT_MSG="[App Build] update app config"
          fi

          git commit -m "$COMMIT_MSG" || echo "No changes to commit"

          git pull --rebase origin main
          git push origin main

      - name: Cleanup
        if: always()
        working-directory: app
        run: rm -f auth.p8